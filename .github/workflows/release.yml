name: Release APK

# Every merge to main that touches the app publishes a signed APK to GitHub Releases.
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Write signing config (required)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed release."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$RUNNER_TEMP/release.jks" > android/key.properties
      - name: Compute version
        id: version
        run: |
          NAME="$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Build APKs
        run: |
          flutter build apk --release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.code }}
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/sentinel-${{ steps.version.outputs.tag }}-universal.apk"
          flutter build apk --release --split-per-abi --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.code }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$RUNNER_TEMP/sentinel-${{ steps.version.outputs.tag }}-arm64-v8a.apk"
          (cd "$RUNNER_TEMP" && sha256sum sentinel-*.apk > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "$RUNNER_TEMP"/sentinel-*.apk "$RUNNER_TEMP/SHA256SUMS.txt" \
            --target "${{ github.sha }}" \
            --title "Sentinel ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})" \
            --generate-notes \
            --latest
