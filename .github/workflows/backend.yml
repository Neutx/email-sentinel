name: Backend CI

on:
  pull_request:
    paths: ["email_sentinel/**", "tests/**", "scripts/**", "pyproject.toml", "uv.lock", "docs/api/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["email_sentinel/**", "tests/**", "scripts/**", "pyproject.toml", "uv.lock", "docs/api/**", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check email_sentinel tests scripts
          uv run ruff format --check email_sentinel tests scripts
      - name: Tests
        run: uv run pytest -q
      - name: API contract is up to date
        run: uv run python scripts/export_openapi.py --check
