[project]
name = "email-sentinel"
version = "0.2.0"
description = "Autonomous AI-powered Email Watcher, Unsubscriber & Project Updates Notifier"
readme = "README.md"
authors = [
    { name = "Neutx", email = "dlprwz@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
email-sentinel = "email_sentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["email_sentinel"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP006", "UP007", "UP035", "UP042", "UP045"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
